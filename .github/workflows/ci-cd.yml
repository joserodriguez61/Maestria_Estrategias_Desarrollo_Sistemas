name: TaskFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Obtener el código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Ejecutar ESLint
        run: npm run lint
      - name: Validar TypeScript
        run: npm exec --no -- tsc --noEmit
      - name: Ejecutar Vitest
        run: npm test
      - name: Auditar dependencias
        run: npm audit --audit-level=high
      - name: Compilar TaskFlow
        run: npm run build

      - name: Crear ZIP y checksum SHA-256
        shell: bash
        run: |
          test -f dist/index.html
          mkdir -p release
          archive="taskflow-${GITHUB_SHA}.zip"
          (cd dist && zip -qr "../release/$archive" .)
          (cd release && sha256sum "$archive" > "$archive.sha256")

      - name: Publicar artefacto
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: taskflow-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/taskflow-${{ github.sha }}.zip
            release/taskflow-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preparar el artefacto para GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  cd:
    name: Continuous Deployment
    needs: ci
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: taskflow-pages-production
      cancel-in-progress: false
    steps:
      - name: Comprobar que el commit sigue en main
        id: current-main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Se omite el despliegue porque main avanzó a otro commit."
          fi

      - name: Publicar el artefacto en GitHub Pages
        if: steps.current-main.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Comprobar la página y el módulo JavaScript
        if: steps.current-main.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises'

          const get = (url) => fetch(url, { signal: AbortSignal.timeout(10_000) })
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const page = await get(process.env.SITE_URL)
              if (!page.ok) throw new Error('HTML: HTTP ' + page.status)

              const html = await page.text()
              const module = html.match(/<script[^>]*type="module"[^>]*src="(\.\/assets\/[\w.-]+\.js)"/)
              if (!module) throw new Error('El HTML no contiene el módulo de TaskFlow.')

              const asset = await get(new URL(module[1], page.url))
              const mime = asset.headers.get('content-type')?.split(';')[0].trim().toLowerCase()
              await asset.body?.cancel()
              if (!asset.ok || !['text/javascript', 'application/javascript'].includes(mime)) {
                throw new Error('Módulo: HTTP ' + asset.status + ', Content-Type ' + (mime ?? 'ausente'))
              }

              console.log('Página y módulo JavaScript verificados.')
              break
            } catch (error) {
              if (attempt === 6) throw error
              await setTimeout(5_000)
            }
          }
          NODE
